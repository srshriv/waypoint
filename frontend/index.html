<!doctype html>
<html lang="en">
	<head>
		<script>
			document.documentElement.dataset.theme = localStorage.getItem("waypoint-theme") === "light" ? "light" : "dark";
		</script>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
		<title>Waypoint</title>
		<style>
			html,
			body,
			#root {
				width: 100%;
				min-width: 320px;
				min-height: 100%;
				margin: 0;
			}
			body {
				background: #101418;
			}
			html[data-theme="light"] body,
			html[data-theme="light"] .initial-waypoint-boot {
				background: #f6f8fb;
			}
			html[data-theme="light"] .initial-waypoint-boot {
				color: #3c4753;
			}
			.initial-waypoint-boot {
				display: grid;
				position: fixed;
				inset: 0;
				place-content: center;
				gap: 24px;
				background: #101418;
				color: #dde3ea;
				font-family: Arial, sans-serif;
			}
			.initial-waypoint-brand {
				display: flex;
				align-items: center;
				gap: 13px;
				font-size: 25px;
			}
			.initial-waypoint-mark {
				display: grid;
				position: relative;
				width: 44px;
				height: 44px;
				overflow: hidden;
				place-items: center;
				border-radius: 12px;
				background: linear-gradient(140deg, #4c8dff 0 58%, #2563eb 58%);
				box-shadow: inset 0 -5px 0 rgb(16 20 24 / 22%);
			}
			.initial-waypoint-mark::before {
				width: 15px;
				height: 15px;
				border: 3px solid #fff;
				border-width: 3px 3px 0 0;
				content: "";
				transform: rotate(45deg) translate(-2px, 2px);
			}
			.initial-waypoint-progress {
				width: 154px;
				height: 3px;
				margin: 0 auto;
				overflow: hidden;
				border-radius: 2px;
				background: #22303f;
			}
			.initial-waypoint-progress::after {
				display: block;
				width: 42%;
				height: 100%;
				border-radius: inherit;
				background: #7fb0ff;
				content: "";
				animation: initial-progress 900ms ease-in-out infinite;
			}
			@keyframes initial-progress {
				0% {
					transform: translateX(-110%) scaleX(0.75);
				}
				50% {
					transform: translateX(95%) scaleX(1.15);
				}
				100% {
					transform: translateX(310%) scaleX(0.7);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.initial-waypoint-progress::after {
					animation: none;
					transform: translateX(70%);
				}
			}
		</style>
	</head>
	<body>
		<div id="root"
			><main class="initial-waypoint-boot" aria-hidden="true"
				><div class="initial-waypoint-brand"><span class="initial-waypoint-mark"></span><span>Waypoint</span></div
				><div class="initial-waypoint-progress"></div></main
		></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
